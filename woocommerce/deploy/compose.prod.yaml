# Production stack: Caddy (auto HTTPS) -> WordPress/Apache -> MariaDB.
# Usage: cp .env.example .env, fill it in, then `docker compose -f compose.prod.yaml up -d`.
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
  wp:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://${DOMAIN}');
        define('WP_SITEURL', 'https://${DOMAIN}');
        $$_SERVER['HTTPS'] = 'on';
    volumes:
      - wp:/var/www/html
      - ../theme/acme:/var/www/html/wp-content/themes/acme:ro
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [wp]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
volumes:
  db:
  wp:
  caddy:
