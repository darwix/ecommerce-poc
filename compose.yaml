name: woocommerce
services:
  db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
  wp:
    image: docker.io/library/wordpress:6-php8.3-apache
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wp:/var/www/html
      - ./theme/acme:/var/www/html/wp-content/themes/acme
  cli:
    image: docker.io/library/wordpress:cli-php8.3
    depends_on: [wp]
    profiles: [tools]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wp:/var/www/html
      - ./theme/acme:/var/www/html/wp-content/themes/acme
volumes:
  db:
  wp:
